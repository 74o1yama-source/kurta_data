<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>エンジフェア デジタルマップ（オフライン対応）</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="appHeader">
  <div class="title">エンジフェア デジタルマップ</div>
  <div class="actions">
    <button id="btnClear" class="ghost">選択クリア</button>
    <button id="btnHelp" class="ghost">使い方</button>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div class="searchRow">
      <input id="q" type="search" placeholder="ブース検索（例：AI、ドローン、⑨ など）" />
      <label class="toggle">
        <input id="onlySelected" type="checkbox" />
        <span>選択のみ</span>
      </label>
    </div>

    <div class="hint" id="offlineHint" hidden>
      オフライン中です（端末内の保存データで表示しています）
    </div>

    <div class="list" id="list"></div>

    <div class="editBox" id="editBox" hidden>
      <div class="editTitle">編集モード</div>
      <div class="editRow">
        <label>対象ブース：</label>
        <select id="editBooth"></select>
      </div>
      <div class="editRow">
        <button id="btnSetPoint">このブースの位置を次のタップで設定</button>
      </div>
      <div class="editRow">
        <button id="btnRouteAdd">ルート点を追加（地図をタップして点追加）</button>
        <button id="btnRouteUndo" class="ghost">1点戻す</button>
      </div>
      <div class="editRow">
        <button id="btnCopyJson" class="ghost">座標/ルートをJSONでコピー</button>
      </div>
      <div class="editNote">
        ※ URL末尾に <code>?edit=1</code> を付けると編集モードになります。
      </div>
    </div>
  </section>

  <section class="mapWrap">
    <div class="mapStage" id="stage">
      <img id="mapImg" src="./map.webp" alt="会場マップ" />
      <svg id="overlay" class="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <g id="routesLayer"></g>
        <g id="marksLayer"></g>
      </svg>
    </div>
    <div class="tapHint">地図はピンチ拡大できます（スマホブラウザの標準機能）</div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modalCard">
    <div class="modalTitle">使い方</div>
    <div class="modalBody">
      <ul>
        <li>左の一覧で行きたいブースにチェック → 地図上に丸マークが残ります。</li>
        <li>チェックは端末に保存され、オフラインでも復元されます。</li>
        <li>事前に一度オンラインで開くと、当日オフラインでも表示できます。</li>
        <li>（運用者用）<code>?edit=1</code> を付けると、ブース位置・ルートをタップで作成できます。</li>
      </ul>
    </div>
    <div class="modalActions">
      <button id="btnClose">閉じる</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
  // Service Worker register
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
